openapi: 3.1.0
info:
  title: UPP API
  version: 0.2.0-draft
  summary: Draft HTTP transport binding for the Universal Procurement Protocol.
  description: >
    This OpenAPI document is a transport binding for UPP. Following the UCP
    baseline pattern, transport definitions reference canonical base schemas
    from the schema registry rather than redefining payload shapes inline.
servers:
  - url: https://api.vendor.example.com
paths:
  /.well-known/upp:
    get:
      summary: Fetch vendor capability profile
      operationId: getCapabilityProfile
      responses:
        "200":
          description: Capability profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityProfile"
  /source-artifacts:
    post:
      summary: Register source procurement artifact metadata
      operationId: createSourceArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceArtifact"
      responses:
        "201":
          description: Source artifact registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceArtifact"
  /source-artifacts/{artifactId}:
    get:
      summary: Fetch source artifact metadata
      operationId: getSourceArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceArtifact"
  /intents:
    post:
      summary: Create intent
      operationId: createIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Intent"
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
  /intents/{intentId}:
    get:
      summary: Fetch intent
      operationId: getIntent
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
  /discovery/requests:
    post:
      summary: Execute discovery request
      operationId: createDiscoveryRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "201":
          description: Discovery request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
  /discovery/responses/{responseId}:
    get:
      summary: Fetch discovery response
      operationId: getDiscoveryResponse
      parameters:
        - in: path
          name: responseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discovery response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
  /rfqs:
    post:
      summary: Submit RFQ
      operationId: createRfq
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RFQ"
      responses:
        "201":
          description: RFQ accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFQ"
  /rfqs/{rfqId}:
    get:
      summary: Fetch RFQ
      operationId: getRfq
      parameters:
        - in: path
          name: rfqId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFQ"
  /quotes/{quoteId}:
    get:
      summary: Fetch quote
      operationId: getQuote
      parameters:
        - in: path
          name: quoteId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /purchase-orders:
    post:
      summary: Submit purchase order
      operationId: createPurchaseOrder
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrder"
      responses:
        "201":
          description: Purchase order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /purchase-orders/{purchaseOrderId}:
    get:
      summary: Fetch purchase order
      operationId: getPurchaseOrder
      parameters:
        - in: path
          name: purchaseOrderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /invoices:
    post:
      summary: Submit invoice
      operationId: createInvoice
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Invoice"
      responses:
        "201":
          description: Invoice accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /approvals/{approvalId}:
    get:
      summary: Fetch approval status
      operationId: getApprovalStatus
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalStatus"
components:
  schemas:
    CapabilityProfile:
      $ref: ../schemas/capability-profile.schema.json
    SourceArtifact:
      $ref: ../schemas/source-artifact.schema.json
    Intent:
      $ref: ../schemas/intent.schema.json
    DiscoveryRequest:
      $ref: ../schemas/discovery-request.schema.json
    DiscoveryResponse:
      $ref: ../schemas/discovery-response.schema.json
    RFQ:
      $ref: ../schemas/rfq.schema.json
    Quote:
      $ref: ../schemas/quote.schema.json
    PurchaseOrder:
      $ref: ../schemas/purchase-order.schema.json
    Invoice:
      $ref: ../schemas/invoice.schema.json
    ApprovalStatus:
      $ref: ../schemas/approval.schema.json
