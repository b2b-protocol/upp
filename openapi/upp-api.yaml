openapi: 3.1.0
info:
  title: UPP API
  version: 0.1.0-draft
  summary: Draft HTTP API for the Universal Procurement Protocol.
  description: >
    This API draft covers minimal capability discovery and the core RFQ, quote,
    purchase order, invoice, and approval workflows for UPP.
servers:
  - url: https://api.vendor.example.com
paths:
  /.well-known/upp-capabilities:
    get:
      summary: Fetch vendor capability document
      operationId: getCapabilities
      responses:
        "200":
          description: Capability document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDocument"
  /rfqs:
    post:
      summary: Submit RFQ
      operationId: createRfq
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RFQ"
      responses:
        "201":
          description: RFQ accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFQ"
  /quotes/{quoteId}:
    get:
      summary: Fetch quote
      operationId: getQuote
      parameters:
        - in: path
          name: quoteId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /purchase-orders:
    post:
      summary: Submit purchase order
      operationId: createPurchaseOrder
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrder"
      responses:
        "201":
          description: Purchase order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /purchase-orders/{purchaseOrderId}:
    get:
      summary: Fetch purchase order
      operationId: getPurchaseOrder
      parameters:
        - in: path
          name: purchaseOrderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /invoices:
    post:
      summary: Submit invoice
      operationId: createInvoice
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Invoice"
      responses:
        "201":
          description: Invoice accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /approvals/{approvalId}:
    get:
      summary: Fetch approval status
      operationId: getApprovalStatus
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalStatus"
components:
  schemas:
    Party:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        contactEmail:
          type: string
          format: email
        externalIds:
          type: object
          additionalProperties:
            type: string
    PaymentTerms:
      type: object
      properties:
        code:
          type: string
        dueDays:
          type: integer
          minimum: 0
        discountPercent:
          type: number
          minimum: 0
    Extensions:
      type: object
      propertyNames:
        pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)+$"
      additionalProperties: true
    CapabilityDocument:
      type: object
      required: [specVersion, id, type, vendor, supportedModules, endpoints]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: CapabilityDocument
        vendor:
          $ref: "#/components/schemas/Party"
        supportedModules:
          type: array
          items:
            type: string
        auth:
          type: object
          properties:
            methods:
              type: array
              items:
                type: string
        endpoints:
          type: object
          properties:
            rfq:
              type: string
            purchaseOrders:
              type: string
            invoices:
              type: string
            approvals:
              type: string
        constraints:
          type: object
          additionalProperties: true
        extensions:
          $ref: "#/components/schemas/Extensions"
    RFQLineItem:
      type: object
      required: [id, description, quantity, unit]
      properties:
        id:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
        targetUnitPrice:
          type: number
          minimum: 0
    RFQ:
      type: object
      required: [specVersion, id, type, buyer, vendor, lineItems, responseDueAt]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: RFQ
        buyer:
          $ref: "#/components/schemas/Party"
        vendor:
          $ref: "#/components/schemas/Party"
        currency:
          type: string
        responseDueAt:
          type: string
          format: date-time
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/RFQLineItem"
        extensions:
          $ref: "#/components/schemas/Extensions"
    Quote:
      type: object
      required: [specVersion, id, type, rfqId, vendor, lineItems, validUntil, currency]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: Quote
        rfqId:
          type: string
        vendor:
          $ref: "#/components/schemas/Party"
        currency:
          type: string
        validUntil:
          type: string
          format: date-time
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        lineItems:
          type: array
          items:
            type: object
            properties:
              rfqLineItemId:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
              leadTimeDays:
                type: integer
        totals:
          type: object
          properties:
            subtotal:
              type: number
            tax:
              type: number
            total:
              type: number
        extensions:
          $ref: "#/components/schemas/Extensions"
    ApprovalStatus:
      type: object
      required: [specVersion, id, type, resourceType, resourceId, state]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: ApprovalStatus
        resourceType:
          type: string
        resourceId:
          type: string
        state:
          type: string
          enum: [not_required, pending, approved, rejected]
        updatedAt:
          type: string
          format: date-time
    PurchaseOrder:
      type: object
      required: [specVersion, id, type, buyer, vendor, lineItems, status, currency]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: PurchaseOrder
        buyer:
          $ref: "#/components/schemas/Party"
        vendor:
          $ref: "#/components/schemas/Party"
        rfqId:
          type: string
        quoteId:
          type: string
        status:
          type: string
        currency:
          type: string
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        approvalStatus:
          $ref: "#/components/schemas/ApprovalStatus"
        lineItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
              quantity:
                type: number
              unit:
                type: string
              unitPrice:
                type: number
        totals:
          type: object
          properties:
            subtotal:
              type: number
            tax:
              type: number
            total:
              type: number
        extensions:
          $ref: "#/components/schemas/Extensions"
    Invoice:
      type: object
      required: [specVersion, id, type, invoiceNumber, buyer, vendor, currency, lineItems, matchStatus]
      properties:
        specVersion:
          type: string
        id:
          type: string
        type:
          const: Invoice
        invoiceNumber:
          type: string
        buyer:
          $ref: "#/components/schemas/Party"
        vendor:
          $ref: "#/components/schemas/Party"
        purchaseOrderId:
          type: string
        quoteId:
          type: string
        currency:
          type: string
        issuedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        matchStatus:
          type: string
          enum: [matched, mismatch, pending_review]
        lineItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
        totals:
          type: object
          properties:
            subtotal:
              type: number
            tax:
              type: number
            total:
              type: number
        extensions:
          $ref: "#/components/schemas/Extensions"
